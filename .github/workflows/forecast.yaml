name: Forecast (scheduled)

# The prize bot. Every 20 minutes it looks for new questions in FutureEval Fall 2026 and MiniBench,
# forecasts the ones it has not forecast before, and sends each with a short private comment.
# Questions open for about 3 hours, so a 20 minute cadence catches them even when GitHub runs late.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Check the keys are in
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -n "$METACULUS_TOKEN" ] || { echo "::error::The Metaculus key is missing. Add it as the repository secret METACULUS_TOKEN."; exit 1; }
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::error::The model key is missing. Add it as the repository secret OPENROUTER_API_KEY."; exit 1; }
      - run: uv sync --locked
      - name: Forecast
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          PANDA_LOG_PUBKEY: ${{ vars.PANDA_LOG_PUBKEY }}
          PANDA_FORECASTER: ${{ vars.PANDA_FORECASTER }}
        run: uv run python run.py --mode tournament
      - name: Keep the log and the budget count
        if: always()
        run: |
          git config user.name "brightpanda-bot"
          git config user.email "brightpanda-bot@users.noreply.github.com"
          git add logs/runs.age.jsonl state/budget.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "log: forecast run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
