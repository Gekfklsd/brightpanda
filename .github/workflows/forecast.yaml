name: Forecast (scheduled)

# The prize bot. It looks for new questions in FutureEval Fall 2026 and MiniBench every 15 minutes,
# forecasts the ones it has not forecast before, and sends each with a short private comment.
# GitHub's timer fired only twice in 15 hours, so each job keeps its own clock (scripts/loop.sh)
# for about 5h40 and then starts the next job. The cron below is only a backstop.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Check the keys are in
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -n "$METACULUS_TOKEN" ] || { echo "::error::The Metaculus key is missing. Add it as the repository secret METACULUS_TOKEN."; exit 1; }
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::error::The model key is missing. Add it as the repository secret OPENROUTER_API_KEY."; exit 1; }
      - run: uv sync --locked
      - name: Forecast
        id: loop
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          PANDA_LOG_PUBKEY: ${{ vars.PANDA_LOG_PUBKEY }}
          PANDA_FORECASTER: ${{ vars.PANDA_FORECASTER }}
        run: |
          git config user.name "brightpanda-bot"
          git config user.email "brightpanda-bot@users.noreply.github.com"
          bash scripts/loop.sh
      - name: Start the next job
        # only after a full loop: a job that failed early must never restart itself in a tight circle
        if: ${{ !cancelled() && steps.loop.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run forecast.yaml --ref main
